{% extends "base.html" %}

{% block content %}
<div data-ll-page="register"></div>

<div class="panel auth-card">
  <h1>Create account</h1>
  <p class="sub">Start getting recommendations built from your own activity.</p>

  {% if error %}<div class="alert">{{ error }}</div>{% endif %}

  <form method="post" action="/register">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8">
    </div>
    <button class="btn" type="submit" style="width:100%">Create account</button>
  </form>

  <p class="sub" style="margin:16px 0 0">
    Already registered? <a href="/login">Sign in</a>.
  </p>
</div>
{% endblock %}
