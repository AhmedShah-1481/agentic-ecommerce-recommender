{# Digest email. Table-based layout with inline styles: email clients strip
   <style> blocks and have no flexbox/grid support. #}
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>{{ headline }}</title></head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="width:600px;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">

        <tr>
          <td style="background:#1e2233;padding:22px 28px;">
            <div style="color:#ffffff;font-size:18px;font-weight:700;">{{ app_name }}</div>
            <div style="color:#9aa3bb;font-size:13px;margin-top:2px;">Your learning digest</div>
          </td>
        </tr>

        <tr>
          <td style="padding:28px 28px 8px;">
            <h1 style="margin:0 0 12px;font-size:21px;line-height:1.35;color:#1e2233;">{{ headline }}</h1>
            <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#4a5169;">{{ narrative }}</p>
          </td>
        </tr>

        {% for item in items %}
        <tr>
          <td style="padding:0 28px 14px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="border:1px solid #e5e7ee;border-radius:10px;">
              <tr>
                <td style="padding:16px 18px;">
                  <div style="font-size:11px;color:#8890a8;text-transform:uppercase;letter-spacing:.05em;">
                    {{ loop.index }} &middot; {{ item.category }}
                  </div>
                  <a href="{{ base_url }}/product/{{ item.product_id }}"
                     style="display:block;margin:5px 0 6px;font-size:16px;font-weight:600;color:#2d4bd8;text-decoration:none;">
                    {{ item.title }}
                  </a>
                  {% if item.reason %}
                    <div style="font-size:13.5px;line-height:1.55;color:#5a6178;">{{ item.reason }}</div>
                  {% endif %}
                  <div style="margin-top:10px;font-size:13px;color:#1e2233;font-weight:600;">
                    {{ item.price_label }}
                    <span style="color:#8890a8;font-weight:400;">&middot; {{ item.level }}</span>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endfor %}

        <tr>
          <td style="padding:8px 28px 28px;">
            <a href="{{ base_url }}/dashboard"
               style="display:inline-block;background:#2d4bd8;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:500;">
              See all recommendations
            </a>
          </td>
        </tr>

        <tr>
          <td style="border-top:1px solid #e5e7ee;padding:18px 28px;background:#fafbfc;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#8890a8;">
              Sent because your browsing on {{ digest_date }} showed new interests.
              {% if detected_interests %}
                Detected: {{ detected_interests | join(', ') }}.
              {% endif %}
            </p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
