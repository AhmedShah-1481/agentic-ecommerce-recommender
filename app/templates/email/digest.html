{# Digest email. Table-based layout with inline styles: email clients strip
   <style> blocks and have no flexbox/grid support.

   Two things differ deliberately from the storefront it mirrors. Product and
   "see all" links point at `storefront_url`, not `base_url`: those customer
   routes are React now, and `base_url` is the API origin where they would 404.
   And the display face is Georgia rather than the storefront's Fraunces - a
   webfont is not loadable in most mail clients, so the brand's serif voice is
   carried by the closest face that is actually installed everywhere. #}
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>{{ headline }}</title></head>
<body style="margin:0;padding:0;background:#EFEAE1;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EFEAE1;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="width:600px;max-width:600px;background:#FAF7F2;border:1px solid #E8E0D4;">

        <tr>
          <td style="background:#16150F;padding:22px 28px;">
            <div style="color:#FAF7F2;font-family:Georgia,'Times New Roman',serif;font-size:19px;letter-spacing:.02em;">{{ app_name }}</div>
            <div style="color:#9C9585;font-size:12px;margin-top:3px;text-transform:uppercase;letter-spacing:.09em;">Your shopping digest</div>
          </td>
        </tr>

        <tr>
          <td style="padding:30px 28px 10px;">
            <h1 style="margin:0 0 12px;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.3;font-weight:400;color:#16150F;">{{ headline }}</h1>
            <p style="margin:0 0 22px;font-size:15px;line-height:1.65;color:#4B463C;">{{ narrative }}</p>
          </td>
        </tr>

        {% for item in items %}
        <tr>
          <td style="padding:0 28px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="border:1px solid #E8E0D4;background:#ffffff;">
              <tr>
                <td style="padding:16px 18px;">
                  <div style="font-size:10px;color:#8A8271;text-transform:uppercase;letter-spacing:.11em;">
                    {{ '%02d' % loop.index }} &nbsp;/&nbsp; {{ item.category }}
                  </div>
                  <a href="{{ storefront_url }}/product/{{ item.product_id }}"
                     style="display:block;margin:7px 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:17px;color:#16150F;text-decoration:none;">
                    {{ item.title }}
                  </a>
                  {% if item.reason %}
                    {# The agent's own justification for this item. Bordered rather
                       than italicised: it is the substance of the email. #}
                    <div style="font-size:13.5px;line-height:1.55;color:#5A5347;border-left:2px solid #B8502F;padding-left:11px;">{{ item.reason }}</div>
                  {% endif %}
                  <div style="margin-top:12px;font-size:13px;color:#16150F;font-weight:600;">
                    {{ item.price_label }}
                    <span style="color:#8A8271;font-weight:400;">&nbsp;&middot;&nbsp; {{ item.brand }}</span>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endfor %}

        <tr>
          <td style="padding:10px 28px 30px;">
            <a href="{{ storefront_url }}/for-you"
               style="display:inline-block;background:#B8502F;color:#ffffff;text-decoration:none;padding:12px 22px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;">
              See all recommendations
            </a>
          </td>
        </tr>

        <tr>
          <td style="border-top:1px solid #E8E0D4;padding:18px 28px;background:#F3EFE7;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#8A8271;">
              Sent because your browsing on {{ digest_date }} showed new interests.
              {% if detected_interests %}
                Detected: {{ detected_interests | join(', ') }}.
              {% endif %}
            </p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
